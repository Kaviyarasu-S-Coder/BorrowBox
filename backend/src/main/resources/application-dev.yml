spring:
  datasource:
    url: jdbc:h2:mem:borrowboxdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  cache:
    type: simple

logging:
  level:
    root: INFO
    com.borrowbox: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
